
syntax = "proto3";
package c2s;

message ServerInfo
{
    string server_id = 1;
    string server_name = 2;
    int32 server_state = 3;
}

message chat
{
    message request
    {
        int64 user_id = 1;
        int32 msg_type = 2;
        string message = 3;
    }

    message notice
    {
        int64 user_id = 1;
        int32 msg_type = 2;
        string message = 3;
    }
}

message item
{
    message ItemInfo
    {
        int64 uuid = 1;
        int32 count = 2;
        int32 item_id = 3;
    }
    message EquipInfo
    {
        int64 uuid = 1;
        int32 count = 2;
        int32 item_id = 3;
        int32 level = 4;
    }
    message Value {
        // The kind of value.
        oneof kind {
            ItemInfo item_info = 1;
            EquipInfo equip_info = 2;
        }
    }
    message ItemList
    {
        repeated Value list = 1;
    }
}

message frame
{
    message vec2
    {
        float x = 1;
        float y = 2;
    }

    message vec3
    {
        float x = 1;
        float y = 2;
        float z = 3;
    }

    message input
    {
        vec2 pos = 1;
        int32 skill_id = 2;
    }

    message request
    {
        int64 unit_id = 1;
        repeated input inputs = 2;
    }

    message broadcast
    {
        repeated request messages = 1;
    }

}